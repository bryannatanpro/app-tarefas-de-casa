<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315b4d">
  <title>Casa em Ordem</title>
  <style>
    :root { --ink:#1e2a27; --muted:#6d7975; --paper:#f6f5ef; --card:#fffefa; --green:#315b4d; --mint:#dff0e7; --gold:#e7b95d; --line:#e4e4dc; --danger:#ad4e44; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
    main { max-width:650px; margin:auto; min-height:100vh; padding:calc(20px + env(safe-area-inset-top)) 16px calc(95px + env(safe-area-inset-bottom)); }
    header { display:flex; justify-content:space-between; align-items:center; margin:4px 4px 22px; } h1 { font-size:25px; margin:0; letter-spacing:-.8px; } header p { color:var(--muted); margin:4px 0 0; font-size:13px; }
    .date { background:var(--mint); color:var(--green); border-radius:16px; padding:9px 11px; font-size:12px; font-weight:700; text-align:center; }
    .summary { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:23px; } .metric { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:13px; } .metric b { display:block; font-size:23px; } .metric span { font-size:11px; color:var(--muted); }
    .views { display:flex; gap:8px; margin:0 3px 15px; } .view, .tab, button { border:0; font:inherit; cursor:pointer; } .view { flex:1; padding:10px; color:var(--muted); background:#e9eae4; border-radius:12px; font-size:13px; font-weight:700; } .view.active { color:white; background:var(--green); } .tabs { display:flex; gap:7px; overflow:auto; padding-bottom:13px; } .tab { white-space:nowrap; color:var(--muted); background:#e9eae4; border-radius:99px; padding:9px 13px; font-size:13px; } .tab.active { color:white; background:var(--green); }
    .section-title { display:flex; justify-content:space-between; align-items:baseline; margin:7px 3px 10px; } h2 { font-size:16px; margin:0; } .section-title span { font-size:12px; color:var(--muted); }
    .task-list { display:grid; gap:9px; } .task { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:17px; padding:12px; } .task.overdue { border-color:#e5b7b1; background:#fffaf8; } .task.done { opacity:.62; } .task.done .task-name { text-decoration:line-through; }
    .check { appearance:none; width:23px; height:23px; flex:0 0 23px; border:2px solid #a4b0a9; border-radius:8px; background:white; } .check:checked { background:var(--green); border-color:var(--green); } .check:checked:after { content:'✓'; display:block; text-align:center; color:white; font-weight:900; line-height:19px; }
    .task-content { min-width:0; flex:1; } .task-name { font-size:15px; font-weight:700; } .task-info { color:var(--muted); font-size:12px; margin-top:3px; } .status { display:inline-block; margin-top:6px; padding:4px 7px; border-radius:99px; background:#f9ded9; color:var(--danger); font-size:11px; font-weight:800; } .next-date { text-align:right; min-width:73px; color:var(--muted); font-size:11px; line-height:1.35; } .next-date b { display:block; color:var(--ink); font-size:12px; } .tag { color:var(--green); background:var(--mint); padding:5px 8px; border-radius:99px; font-size:11px; white-space:nowrap; } .edit, .delete { background:transparent; padding:5px; font-size:16px; } .edit { color:var(--green); } .delete { color:#a4aaa6; }
    #weekScreen { overflow-x:auto; padding-bottom:8px; } .week-grid { display:grid; grid-template-columns:repeat(6, minmax(158px, 1fr)); gap:10px; min-width:1030px; } .weekday { background:var(--card); border:1px solid var(--line); border-radius:17px; padding:13px; min-height:230px; } .weekday-head { display:flex; justify-content:space-between; margin-bottom:8px; } .weekday h3 { margin:0; font-size:15px; } .weekday small { color:var(--muted); } .week-task { padding:8px 0; border-top:1px solid var(--line); font-size:14px; } .week-task:first-of-type { border-top:0; } .monthly-bucket { margin-top:10px; padding-top:9px; border-top:1px solid var(--line); } .monthly-bucket b { color:var(--green); font-size:11px; text-transform:uppercase; letter-spacing:.3px; } .monthly-bucket .week-task { padding:7px 0 0; border:0; } .unplanned { color:var(--muted); font-size:13px; text-align:center; margin:16px 0 0; }
    .empty { text-align:center; color:var(--muted); padding:32px 12px; background:var(--card); border:1px dashed #cbd1cb; border-radius:17px; }
    .add { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); padding:15px 22px; border-radius:99px; color:white; background:var(--green); box-shadow:0 7px 20px #315b4d55; font-weight:800; } .backup { color:var(--green); background:transparent; padding:8px; font-size:12px; font-weight:800; } .backup-actions { display:grid; gap:10px; } .backup-action { display:block; width:100%; padding:13px; border-radius:12px; text-align:left; color:var(--ink); background:#edf1eb; } .backup-action b { display:block; margin-bottom:3px; } .backup-action span { font-size:12px; color:var(--muted); } .backup-note { color:var(--muted); font-size:12px; line-height:1.5; margin-top:16px; }
    dialog { width:min(94vw, 520px); border:0; padding:0; border-radius:22px; color:var(--ink); box-shadow:0 20px 60px #0005; } dialog::backdrop { background:#15231d77; } form { padding:22px; } form h2 { margin-bottom:17px; font-size:21px; } label { display:block; font-size:12px; color:var(--muted); font-weight:700; margin:13px 0 5px; } input, select { width:100%; padding:12px; border:1px solid #d9ddd7; border-radius:11px; background:#fbfbf7; font:inherit; color:var(--ink); } #weekdays { display:flex; flex-wrap:wrap; gap:7px; } #weekdays label { display:flex; align-items:center; gap:3px; margin:0; padding:6px 8px; border:1px solid #d9ddd7; border-radius:8px; font-size:11px; } #weekdays input { width:auto; padding:0; } .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:22px; } .secondary { background:#e9eae4; color:var(--ink); padding:11px 14px; border-radius:11px; } .primary { background:var(--green); color:white; padding:11px 15px; border-radius:11px; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Casa em Ordem</h1><p>Uma rotina leve, um dia por vez.</p></div><div><div class="date" id="todayDate"></div><button class="backup" id="openBackup">Backup</button></div></header>
    <section class="summary"><div class="metric"><b id="dueCount">0</b><span>para hoje</span></div><div class="metric"><b id="doneCount">0</b><span>concluídas</span></div><div class="metric"><b id="weekCount">0</b><span>esta semana</span></div></section>
    <nav class="views" aria-label="Modo de organização"><button class="view active" data-view="frequency">Por frequência</button><button class="view" data-view="week">Semana</button></nav>
    <section id="frequencyScreen"><nav class="tabs" aria-label="Frequência das tarefas"><button class="tab active" data-filter="daily">Diárias</button><button class="tab" data-filter="specific">Dias específicos</button><button class="tab" data-filter="weekly">Semanais</button><button class="tab" data-filter="biweekly">Quinzenais</button><button class="tab" data-filter="monthly">Mensais</button><button class="tab" data-filter="sixtyDays">60 dias</button><button class="tab" data-filter="once">Aleatórias</button><button class="tab" data-filter="all">Todas</button></nav><div class="section-title"><h2 id="listTitle">Tarefas diárias</h2><span id="listHint"></span></div><section class="task-list" id="taskList"></section></section>
    <section id="weekScreen" hidden><div class="section-title"><h2>Plano da semana</h2><span>por dia</span></div><section class="week-grid" id="weekGrid"></section><p class="unplanned" id="unplanned"></p></section>
  </main>
  <button class="add" id="openAdd">＋ Adicionar tarefa</button>
  <dialog id="taskDialog"><form id="taskForm"><input id="taskId" type="hidden"><h2 id="dialogTitle">Nova tarefa</h2><label for="name">O que precisa ser feito?</label><input id="name" required placeholder="Ex.: Trocar a roupa de cama" maxlength="80"><label for="category">Tipo</label><select id="category"><option value="home">Casa</option><option value="commitment">Compromisso</option><option value="routine">Rotina pessoal</option></select><label for="frequency">Repetir</label><select id="frequency"><option value="once">Uma vez</option><option value="daily">Todos os dias</option><option value="specific">Dias específicos da semana</option><option value="weekly">Toda semana</option><option value="biweekly">A cada duas semanas</option><option value="monthly">Todo mês</option><option value="sixtyDays">A cada 60 dias</option></select><div id="weekdayField" hidden><label>Dias da semana</label><div id="weekdays"><label><input type="checkbox" value="1"> Seg</label> <label><input type="checkbox" value="2"> Ter</label> <label><input type="checkbox" value="3"> Qua</label> <label><input type="checkbox" value="4"> Qui</label> <label><input type="checkbox" value="5"> Sex</label> <label><input type="checkbox" value="6"> Sáb</label></div></div><label for="date">Próxima data</label><input id="date" type="date" required><div class="form-actions"><button class="secondary" type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar tarefa</button></div></form></dialog>
  <dialog id="taskDialog"><form id="taskForm"><input id="taskId" type="hidden"><h2 id="dialogTitle">Nova tarefa</h2><label for="name">O que precisa ser feito?</label><input id="name" required placeholder="Ex.: Trocar a roupa de cama" maxlength="80"><label for="category">Tipo</label><select id="category"><option value="home">Casa</option><option value="commitment">Compromisso</option><option value="routine">Rotina pessoal</option></select><label for="frequency">Repetir</label><select id="frequency"><option value="once">Uma vez</option><option value="daily">Todos os dias</option><option value="specific">Dias específicos da semana</option><option value="weekly">Toda semana</option><option value="biweekly">A cada duas semanas</option><option value="monthly">Todo mês</option><option value="sixtyDays">A cada 60 dias</option></select><div id="weekdayField" hidden><label>Dias da semana</label><div id="weekdays"><label><input type="checkbox" value="1"> Seg</label> <label><input type="checkbox" value="2"> Ter</label> <label><input type="checkbox" value="3"> Qua</label> <label><input type="checkbox" value="4"> Qui</label> <label><input type="checkbox" value="5"> Sex</label> <label><input type="checkbox" value="6"> Sáb</label></div></div><label for="date">Próxima data</label><input id="date" type="date" required><div class="form-actions"><button class="secondary" type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar tarefa</button></div></form></dialog>
  <dialog id="backupDialog"><form method="dialog"><h2>Backup das tarefas</h2><div class="backup-actions"><button class="backup-action" type="button" id="exportBackup"><b>Exportar backup</b><span>Baixa um arquivo para levar suas tarefas a outro aparelho.</span></button><button class="backup-action" type="button" id="importBackup"><b>Importar backup</b><span>Carrega um arquivo salvo anteriormente e substitui as tarefas atuais.</span></button><input id="backupFile" type="file" accept="application/json,.json" hidden></div><p class="backup-note">No iPhone, salve o arquivo em Arquivos ou envie para você mesma. Depois abra o backup no outro aparelho.</p><div class="form-actions"><button class="secondary" value="cancel">Fechar</button></div></form></dialog>
  <script>
    const key='casa-em-ordem-v2', today=new Date(); today.setHours(0,0,0,0);
    const iso=d=>d.toISOString().slice(0,10), format=d=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(d);
    const initial=[
      {id:1,name:'Arrumar a cama',category:'home',frequency:'daily',date:iso(today),done:false},
      {id:2,name:'Passar aspirador sala e cozinha',category:'home',frequency:'daily',date:iso(today),done:false,weekdays:[1,3,5,6]},
      {id:3,name:'Dobrar roupas',category:'home',frequency:'daily',date:iso(today),done:false},
      {id:4,name:'Colocar roupa pra lavar',category:'home',frequency:'daily',date:iso(today),done:false,weekdays:[1,2,3,4,5,6]},
      {id:5,name:'Limpar fogão',category:'home',frequency:'daily',date:iso(today),done:false},
      {id:6,name:'Passar mop sala e cozinha',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:7,name:'Passar aspirador na casa inteira',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:8,name:'Limpar banheiro básico',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:9,name:'Fazer marmitas',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:10,name:'Tirar pó',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:11,name:'Trocar toalhas de rosto, mãos, corpo e roupas de cama',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:12,name:'Lavar panos de chão',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:13,name:'Limpar filtro da máquina de lavar',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:14,name:'Limpar armários da cozinha por fora',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:15,name:'Limpar inox (térmica, panela elétrica, chaleira elétrica)',category:'home',frequency:'weekly',date:iso(today),done:false},
      {id:16,name:'Limpar ranhuras',category:'home',frequency:'biweekly',date:iso(today),done:false},
      {id:17,name:'Passar mop na casa inteira',category:'home',frequency:'biweekly',date:iso(today),done:false},
      {id:18,name:'Limpar micro-ondas e forno',category:'home',frequency:'biweekly',date:iso(today),done:false},
      {id:19,name:'Lavar tampa e painel da máquina',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:20,name:'Limpar banheiro completo',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:21,name:'Limpar janelas',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:22,name:'Limpar espelhos',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:23,name:'Limpar máquina de lavar por dentro',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:24,name:'Organizar roupeiros',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:25,name:'Limpar cafeteira',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:26,name:'Limpar geladeira',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:27,name:'Limpar lixeiras',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:28,name:'Limpar armários da cozinha por dentro',category:'home',frequency:'monthly',date:iso(today),done:false},
      {id:29,name:'Lavar alface',category:'home',frequency:'once',date:iso(today),done:false},
      {id:30,name:'Tirar mancha da torre quente',category:'home',frequency:'once',date:iso(today),done:false},
      {id:31,name:'Arrumar forro embaixo do sofá',category:'home',frequency:'once',date:iso(today),done:false},
      {id:32,name:'Colocar canaleta no fio do micro-ondas',category:'home',frequency:'once',date:iso(today),done:false},
      {id:33,name:'Colocar LED no armário da cozinha',category:'home',frequency:'once',date:iso(today),done:false}
    ];
    let tasks=JSON.parse(localStorage.getItem(key)||'null')||initial, filter='daily', view='frequency';
    const starterWeekdays={'Passar aspirador sala e cozinha':[1,3,5,6],'Colocar roupa pra lavar':[1,2,3,4,5,6]};
    tasks.forEach(t=>{if(starterWeekdays[t.name]&&!t.weekdays)t.weekdays=starterWeekdays[t.name];if(t.frequency==='daily'&&t.weekdays&&t.weekdays.length)t.frequency='specific';if(t.frequency==='daily')delete t.weekdays;});
    tasks.filter(t=>t.frequency==='monthly').forEach((t,index)=>{if(!t.weekdays||!t.weekdays.length)t.weekdays=[6];if(t.weekdays.includes(6)&&!t.monthlySaturday)t.monthlySaturday=(index%4)+1;});
    const list=document.querySelector('#taskList'), dialog=document.querySelector('#taskDialog'), backupDialog=document.querySelector('#backupDialog'), weekGrid=document.querySelector('#weekGrid');
    document.querySelector('#todayDate').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'numeric',month:'short'}).format(today).replace('.', '');
    document.querySelector('#date').value=iso(today);
    const label={home:'Casa',commitment:'Compromisso',routine:'Rotina pessoal'}, repeat={once:'uma vez',daily:'todos os dias',specific:'dias específicos',weekly:'semanalmente',biweekly:'quinzenalmente',monthly:'mensalmente',sixtyDays:'a cada 60 dias'};
    function dayOf(t){ return new Date(t.date+'T00:00:00'); }
    function alignToDays(d, weekdays){ const next=new Date(d); while(!weekdays.includes(next.getDay()))next.setDate(next.getDate()+1); return next; }
    function nextMonthlySaturdayDate(d, slot){ const next=new Date(d); while(next.getDay()!==6||Math.floor((next.getDate()-1)/7)+1!==slot)next.setDate(next.getDate()+1); return next; }
    function advance(d, frequency){ const next=new Date(d); if(frequency==='daily')next.setDate(next.getDate()+1); else if(frequency==='weekly')next.setDate(next.getDate()+7); else if(frequency==='biweekly')next.setDate(next.getDate()+14); else if(frequency==='monthly')next.setMonth(next.getMonth()+1); else if(frequency==='sixtyDays')next.setDate(next.getDate()+60); return next; }
    function nextSpecificDate(d, weekdays){ const next=new Date(d); do { next.setDate(next.getDate()+1); } while(!weekdays.includes(next.getDay())); return next; }
    function nextExecution(t){ let next=dayOf(t); if(t.frequency==='once'||next>=today)return next; if(t.frequency==='specific')return nextSpecificDate(today,t.weekdays); do { next=advance(next,t.frequency); } while(next<=today); return t.weekdays&&t.weekdays.length?alignToDays(next,t.weekdays):next; }
    tasks.forEach(t=>{if(['specific','weekly','biweekly','monthly','sixtyDays'].includes(t.frequency)&&t.weekdays&&t.weekdays.length){let base=dayOf(t);if(base<today)base=new Date(today);t.date=iso(t.frequency==='monthly'&&t.weekdays.includes(6)&&t.monthlySaturday?nextMonthlySaturdayDate(base,t.monthlySaturday):alignToDays(base,t.weekdays));}});
    function save(){localStorage.setItem(key,JSON.stringify(tasks));}
    save();
    function selected(){ return tasks.filter(t=>filter==='all'||t.frequency===filter).sort((a,b)=>dayOf(a)-dayOf(b)); }
    function renderWeek(){ const days=[['Segunda',1],['Terça',2],['Quarta',3],['Quinta',4],['Sexta',5],['Sábado',6]]; weekGrid.innerHTML=days.map(([name,id])=>{const entries=tasks.filter(t=>t.frequency!=='monthly'&&(t.frequency==='daily'||t.weekdays&&t.weekdays.includes(id))||t.frequency==='monthly'&&id!==6&&t.weekdays&&t.weekdays.includes(id));const monthly=id===6?tasks.filter(t=>t.frequency==='monthly'&&t.weekdays&&t.weekdays.includes(6)):[];const regular=entries.length?entries.map(t=>`<div class="week-task">${escapeHtml(t.name)}</div>`).join(''):'';const monthlyGroups=monthly.map(t=>t.monthlySaturday).filter((v,i,a)=>a.indexOf(v)===i).sort().map(slot=>`<div class="monthly-bucket"><b>${slot}º sábado do mês</b>${monthly.filter(t=>t.monthlySaturday===slot).map(t=>`<div class="week-task">${escapeHtml(t.name)}</div>`).join('')}</div>`).join('');const total=entries.length+monthly.length;return `<article class="weekday"><div class="weekday-head"><h3>${name}</h3><small>${total} tarefa${total!==1?'s':''}</small></div>${regular||monthlyGroups?'':'<small>Nenhuma tarefa definida</small>'}${regular}${monthlyGroups}</article>`;}).join(''); const count=tasks.filter(t=>t.frequency!=='daily'&&(!t.weekdays||!t.weekdays.length)).length;document.querySelector('#unplanned').textContent=count?`${count} tarefa${count!==1?'s':''} ainda sem dia da semana. Edite uma tarefa para organizá-la aqui.`:''; }
    function render(){ const todayTasks=tasks.filter(t=>dayOf(t)<=today&&!t.done), done=tasks.filter(t=>t.done), week=new Date(today);week.setDate(today.getDate()+7); document.querySelector('#dueCount').textContent=todayTasks.length;document.querySelector('#doneCount').textContent=done.length;document.querySelector('#weekCount').textContent=tasks.filter(t=>dayOf(t)<=week&&!t.done).length;
      const titles={daily:'Tarefas diárias',specific:'Tarefas em dias específicos',weekly:'Tarefas semanais',biweekly:'Tarefas quinzenais',monthly:'Tarefas mensais',sixtyDays:'Tarefas a cada 60 dias',once:'Tarefas aleatórias',all:'Todas as tarefas'};document.querySelector('#listTitle').textContent=titles[filter]; const found=selected();document.querySelector('#listHint').textContent=found.length?(found.length+' tarefa'+(found.length!==1?'s':'')):'';
      list.innerHTML=found.length?found.map(t=>{const due=dayOf(t), overdue=!t.done&&due<today, next=nextExecution(t), dateLabel=t.frequency==='once'?'Data programada':'Próxima execução'; return `<article class="task ${t.done?'done':''} ${overdue?'overdue':''}"><input class="check" type="checkbox" ${t.done?'checked':''} aria-label="Concluir ${t.name}" onchange="toggle(${t.id})"><div class="task-content"><div class="task-name">${escapeHtml(t.name)}</div><div class="task-info">${repeat[t.frequency]}</div>${overdue?`<span class="status">Em atraso · venceu ${format(due)}</span>`:''}</div><div class="next-date">${dateLabel}<b>${format(next)}</b></div><span class="tag">${label[t.category]}</span><button class="edit" title="Editar" aria-label="Editar ${t.name}" onclick="editTask(${t.id})">✎</button><button class="delete" title="Excluir" aria-label="Excluir ${t.name}" onclick="removeTask(${t.id})">×</button></article>`;}).join(''):'<div class="empty">Nada pendente aqui. Que bom! ✨</div>';
      renderWeek();
    }
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    window.toggle=id=>{let t=tasks.find(x=>x.id===id);t.done=!t.done;if(t.done&&t.frequency!=='once'){let d=dayOf(t);if(d<today)d=new Date(today);let next=t.frequency==='specific'?nextSpecificDate(d,t.weekdays):advance(d,t.frequency);if(t.frequency==='monthly'&&t.weekdays&&t.weekdays.includes(6)&&t.monthlySaturday){next.setDate(next.getDate()+1);next=nextMonthlySaturdayDate(next,t.monthlySaturday);}else if(t.weekdays&&t.weekdays.length)next=alignToDays(next,t.weekdays);t.date=iso(next);t.done=false;}save();render();};
    window.removeTask=id=>{tasks=tasks.filter(t=>t.id!==id);save();render();};
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();});
    document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#frequencyScreen').hidden=view!=='frequency';document.querySelector('#weekScreen').hidden=view!=='week';renderWeek();});
    function syncWeekdayField(){document.querySelector('#weekdayField').hidden=!['specific','weekly','biweekly','monthly','sixtyDays'].includes(document.querySelector('#frequency').value);}
    function clearForm(){document.querySelector('#taskForm').reset();document.querySelector('#taskId').value='';document.querySelector('#dialogTitle').textContent='Nova tarefa';document.querySelector('#date').value=iso(today);syncWeekdayField();}
    document.querySelector('#openAdd').onclick=()=>{clearForm();dialog.showModal();};document.querySelector('#cancel').onclick=()=>dialog.close();
    document.querySelector('#frequency').onchange=syncWeekdayField;
    document.querySelector('#openBackup').onclick=()=>backupDialog.showModal();
    document.querySelector('#exportBackup').onclick=()=>{const backup={app:'Casa em Ordem',version:1,exportedAt:new Date().toISOString(),tasks};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`casa-em-ordem-backup-${iso(today)}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);};
    document.querySelector('#importBackup').onclick=()=>document.querySelector('#backupFile').click();
    document.querySelector('#backupFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const backup=JSON.parse(reader.result);if(!Array.isArray(backup.tasks))throw new Error('invalid');if(!confirm(`Importar ${backup.tasks.length} tarefas? As tarefas atuais deste aparelho serão substituídas.`))return;tasks=backup.tasks;save();render();backupDialog.close();alert('Backup importado com sucesso.');}catch{alert('Não foi possível abrir este arquivo de backup.');}finally{e.target.value='';}};reader.readAsText(file);};
    window.editTask=id=>{const t=tasks.find(x=>x.id===id);document.querySelector('#taskId').value=t.id;document.querySelector('#dialogTitle').textContent='Editar tarefa';document.querySelector('#name').value=t.name;document.querySelector('#category').value=t.category;document.querySelector('#frequency').value=t.frequency;document.querySelector('#date').value=t.date;document.querySelectorAll('#weekdays input').forEach(x=>x.checked=(t.weekdays||[]).includes(Number(x.value)));syncWeekdayField();dialog.showModal();};
    function nextMonthlySaturday(){return [1,2,3,4].sort((a,b)=>tasks.filter(t=>t.frequency==='monthly'&&t.monthlySaturday===a).length-tasks.filter(t=>t.frequency==='monthly'&&t.monthlySaturday===b).length)[0];}
    document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();const id=Number(document.querySelector('#taskId').value), existing=tasks.find(t=>t.id===id), data={name:document.querySelector('#name').value.trim(),category:document.querySelector('#category').value,frequency:document.querySelector('#frequency').value,date:document.querySelector('#date').value,weekdays:[...document.querySelectorAll('#weekdays input:checked')].map(x=>Number(x.value))};if(data.frequency==='daily')data.weekdays=[];if(['specific','weekly','biweekly','monthly','sixtyDays'].includes(data.frequency)&&!data.weekdays.length){alert('Marque ao menos um dia da semana.');return;}if(data.frequency==='monthly'&&data.weekdays.includes(6))data.monthlySaturday=existing&&existing.monthlySaturday||nextMonthlySaturday();if(['specific','weekly','biweekly','monthly','sixtyDays'].includes(data.frequency)){let base=new Date(data.date+'T00:00:00');if(base<today)base=new Date(today);data.date=iso(data.frequency==='monthly'&&data.weekdays.includes(6)&&data.monthlySaturday?nextMonthlySaturdayDate(base,data.monthlySaturday):alignToDays(base,data.weekdays));}if(id){if(data.frequency!=='monthly'||!data.weekdays.includes(6))delete existing.monthlySaturday;Object.assign(existing,data);}else{tasks.push({id:Date.now(),...data,done:false});}save();clearForm();dialog.close();render();};
    render();
  </script>
</body>
</html>
